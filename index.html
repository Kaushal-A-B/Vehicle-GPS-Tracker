<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Entra Innovations — Vehicle GPS Tracker</title>
  <link rel="icon" type="image/png" href="entra_logo.png" />

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #080D1A;
      --panel:      #0F1628;
      --panel-mid:  #141D35;
      --border:     rgba(59,130,246,0.15);
      --accent:     #3B82F6;
      --text-hi:    #EEF2FF;
      --text-mid:   #94A3B8;
      --text-lo:    #4B5A72;
      --green:      #22C55E;
      --green-dim:  rgba(34,197,94,0.15);
      --amber:      #F59E0B;
      --red:        #EF4444;
      --grotesk:    'Space Grotesk', sans-serif;
      --inter:      'Inter', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text-hi);
      font-family: var(--inter);
      overflow: hidden;
    }

    /* ── Shell: header + content ── */
    .shell {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* dynamic viewport height — respects mobile browser chrome */
    }

    /* ── Header ── */
    header {
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      height: 48px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      z-index: 100;
    }

    .brand { display: flex; align-items: center; gap: 10px; }

    .brand-icon {
      width: 26px; height: 26px;
      border: 1.5px solid var(--accent);
      border-radius: 6px;
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .brand-icon svg { width: 13px; height: 13px; }

    .brand-name {
      font-family: var(--grotesk);
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.04em; color: var(--text-hi);
    }
    .brand-sub {
      font-family: var(--inter);
      font-size: 10px; color: var(--text-mid);
      letter-spacing: 0.06em; text-transform: uppercase;
    }

    .live-pill {
      display: flex; align-items: center; gap: 6px;
      background: var(--green-dim);
      border: 1px solid rgba(34,197,94,0.3);
      border-radius: 20px; padding: 3px 10px;
      font-size: 11px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      color: var(--green); font-family: var(--grotesk);
    }
    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      animation: pulse-dot 2s ease-in-out infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%       { opacity: 0.4; transform: scale(0.7); }
    }

    /* ── Content: map + sidebar ── */
    .content {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 320px;
      min-height: 0; /* critical — lets flex child shrink */
    }

    /* ── Map ── */
    .map-wrap { position: relative; overflow: hidden; }
    #map { width: 100%; height: 100%; }

    .leaflet-control-zoom {
      border: 1px solid #d1d5db !important;
      border-radius: 8px !important; overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15) !important;
    }
    .leaflet-control-zoom a {
      background: #fff !important; color: #374151 !important;
      border-color: #e5e7eb !important; font-size: 16px !important;
    }
    .leaflet-control-zoom a:hover { background: #f3f4f6 !important; color: #111827 !important; }

    /* ── Sidebar ── */
    .sidebar {
      background: var(--panel);
      border-left: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden;
    }

    .section-key {
      font-family: var(--grotesk);
      font-size: 10px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--text-lo); margin-bottom: 8px;
    }

    /* Speed */
    .speed-block {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
    }
    .speed-display {
      display: flex; align-items: flex-end; gap: 8px;
      margin-bottom: 12px;
    }
    .speed-num {
      font-family: var(--grotesk);
      font-size: 52px; font-weight: 700; line-height: 1;
      color: var(--text-hi); letter-spacing: -0.03em;
    }
    .speed-unit-stack { padding-bottom: 6px; }
    .speed-unit {
      font-family: var(--inter); font-size: 13px;
      font-weight: 500; color: var(--text-mid); line-height: 1.2;
    }
    .speed-bar-track {
      height: 3px; background: var(--panel-mid);
      border-radius: 2px; overflow: hidden;
    }
    .speed-bar-fill {
      height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, var(--accent), #60A5FA);
      transition: width 0.8s ease, background 0.4s; width: 0%;
    }
    .speed-bar-fill.fast      { background: linear-gradient(90deg, var(--amber), #FCD34D); }
    .speed-bar-fill.very-fast { background: linear-gradient(90deg, var(--red), #F87171); }

    /* Status */
    .status-block {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 8px;
    }
    .status-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 7px 14px; border-radius: 8px;
      font-family: var(--grotesk); font-size: 13px;
      font-weight: 600; letter-spacing: 0.04em; width: fit-content;
    }
    .status-badge.active  { background: var(--green-dim); border: 1px solid rgba(34,197,94,0.3); color: var(--green); }
    .status-badge.stale   { background: rgba(245,158,11,0.12); border: 1px solid rgba(245,158,11,0.3); color: var(--amber); }
    .status-badge.offline { background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); color: var(--red); }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
    .status-badge.active .status-dot { animation: pulse-dot 2s ease-in-out infinite; }

    /* Timestamp */
    .time-block { padding: 18px 20px; flex: 1; }
    .time-val {
      font-family: var(--grotesk);
      font-size: 15px; font-weight: 600;
      color: var(--text-hi); line-height: 1.7;
    }
    .time-date { display: block; }
    .time-time { display: block; }

    /* Error */
    .error-msg {
      display: none; font-family: var(--inter); font-size: 12px;
      color: var(--red); padding: 8px 20px;
      background: rgba(239,68,68,0.08);
      border-top: 1px solid rgba(239,68,68,0.2); text-align: center;
      flex-shrink: 0;
    }

    /* Loading overlay */
    .loading-overlay {
      position: absolute; inset: 0; background: var(--bg);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      z-index: 500; gap: 16px; transition: opacity 0.5s ease;
    }
    .loading-overlay.hide { opacity: 0; pointer-events: none; }
    .loader-ring {
      width: 40px; height: 40px;
      border: 2px solid var(--border); border-top-color: var(--accent);
      border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loader-text {
      font-family: var(--grotesk); font-size: 12px;
      letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-lo);
    }

    /* ── Mobile ── */
    @media (max-width: 768px) {
      header { height: 44px; padding: 0 14px; }
      .brand-name { font-size: 12px; }
      .brand-sub  { font-size: 9px; }

      .content {
        grid-template-columns: 1fr;
        grid-template-rows: 1fr auto;
      }

      /* Bottom strip: 2×2 grid */
      .sidebar {
        border-left: none;
        border-top: 1px solid var(--border);
        flex-direction: row;
        flex-wrap: wrap;
        flex-shrink: 0;
      }

      /* Speed — top-left */
      .speed-block {
        width: 50%;
        border-bottom: 1px solid var(--border);
        border-right: 1px solid var(--border);
        padding: 8px 12px;
        flex: none;
      }
      .speed-display { margin-bottom: 4px; }
      .speed-num { font-size: 28px; }
      .speed-bar-track { height: 2px; }
      .section-key { margin-bottom: 3px; font-size: 9px; }
      .speed-unit { font-size: 11px; }

      /* Status — top-right */
      .status-block {
        width: 50%;
        border-bottom: 1px solid var(--border);
        border-right: none;
        padding: 8px 12px;
        gap: 4px;
        justify-content: center;
        flex: none;
      }
      .status-badge { padding: 4px 10px; font-size: 11px; }

      /* Last Updated — full width bottom row */
      .time-block {
        width: 100%;
        padding: 8px 12px;
        flex: none;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .time-block .section-key { margin-bottom: 0; white-space: nowrap; }
      .time-val { font-size: 12px; line-height: 1.4; }
      .time-date, .time-time { display: inline; }
      .time-date::after { content: ' · '; color: var(--text-lo); }

      .error-msg { font-size: 10px; padding: 4px 12px; width: 100%; }
    }
  </style>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="#3B82F6" stroke-width="2.2"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
          <circle cx="12" cy="9" r="2.5"/>
        </svg>
      </div>
      <div>
        <div class="brand-name">Entra Innovations</div>
        <div class="brand-sub">Vehicle GPS Tracker</div>
      </div>
    </div>
    <div class="live-pill">
      <span class="live-dot"></span>
      Live
    </div>
  </header>

  <div class="content">

    <div class="map-wrap">
      <div id="map"></div>
      <div class="loading-overlay" id="loadingOverlay">
        <div class="loader-ring"></div>
        <div class="loader-text">Acquiring GPS Signal…</div>
      </div>
    </div>

    <aside class="sidebar">

      <div class="speed-block">
        <div class="section-key">Speed</div>
        <div class="speed-display">
          <span class="speed-num" id="speedVal">—</span>
          <div class="speed-unit-stack">
            <div class="speed-unit">km</div>
            <div class="speed-unit">/ h</div>
          </div>
        </div>
        <div class="speed-bar-track">
          <div class="speed-bar-fill" id="speedBar"></div>
        </div>
      </div>

      <div class="status-block">
        <div class="section-key">Signal Status</div>
        <div class="status-badge active" id="statusBadge">
          <span class="status-dot"></span>
          <span id="statusText">Connecting…</span>
        </div>
      </div>

      <div class="time-block">
        <div class="section-key">Last Updated</div>
        <div class="time-val">
          <span class="time-date" id="timeDate">—</span>
          <span class="time-time" id="timeTime">—</span>
        </div>
      </div>

      <div class="error-msg" id="errorMsg">Unable to reach ThingSpeak. Retrying…</div>

    </aside>
  </div>
</div>

<script>
  const CHANNEL_ID = '3405086';
  const READ_KEY   = 'H0BCGRQK82EA58T1';
  const REFRESH_MS = 15000;
  const STALE_SEC  = 130;

  const map = L.map('map', {
    center: [15.3647, 75.1240],
    zoom: 15,
    zoomControl: true,
    attributionControl: true
  });

  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
  }).addTo(map);

  const CAR_ICON = L.divIcon({
    className: '',
    iconSize:  [36, 36],
    iconAnchor:[18, 18],
    html: `
      <div style="position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center;">
        <div style="position:absolute;width:36px;height:36px;border-radius:50%;background:rgba(59,130,246,0.15);animation:ripple 2s ease-out infinite;"></div>
        <div style="width:14px;height:14px;border-radius:50%;background:#3B82F6;border:2.5px solid #fff;box-shadow:0 0 12px rgba(59,130,246,0.8);position:relative;z-index:1;"></div>
      </div>
      <style>@keyframes ripple{0%{transform:scale(0.5);opacity:0.8;}100%{transform:scale(2.2);opacity:0;}}</style>
    `
  });

  let marker    = null;
  let firstLoad = true;

  function formatTimestamp(isoStr) {
    const d = new Date(isoStr);
    const dateStr = d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' });
    const timeStr = d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: true });
    return { dateStr, timeStr };
  }

  function isStale(isoStr) {
    return (Date.now() - new Date(isoStr)) / 1000 > STALE_SEC;
  }

  function setStatus(mode, label) {
    const badge = document.getElementById('statusBadge');
    const text  = document.getElementById('statusText');
    badge.className = 'status-badge ' + mode;
    badge.innerHTML = `<span class="status-dot"></span>`;
    text.textContent = label;
    badge.appendChild(text);
  }

  function updateSpeedBar(spd) {
    const bar = document.getElementById('speedBar');
    bar.style.width = Math.min((spd / 120) * 100, 100) + '%';
    bar.className = 'speed-bar-fill';
    if (spd >= 90)      bar.classList.add('very-fast');
    else if (spd >= 60) bar.classList.add('fast');
  }

  async function fetchData() {
    const url = `https://api.thingspeak.com/channels/${CHANNEL_ID}/feeds.json?api_key=${READ_KEY}&results=1`;
    try {
      const res  = await fetch(url);
      const data = await res.json();

      document.getElementById('errorMsg').style.display = 'none';

      const feed = data.feeds && data.feeds[0];
      if (!feed) { setStatus('offline', 'No Data'); return; }

      const lat = parseFloat(feed.field1);
      const lng = parseFloat(feed.field2);
      const spd = parseFloat(feed.field3) || 0;
      const ts  = feed.created_at;

      if (!isFinite(lat) || !isFinite(lng)) { setStatus('offline', 'No Signal'); return; }

      const spdInt = Math.round(spd);
      document.getElementById('speedVal').textContent = spdInt;
      updateSpeedBar(spdInt);

      const { dateStr, timeStr } = formatTimestamp(ts);
      document.getElementById('timeDate').textContent = dateStr;
      document.getElementById('timeTime').textContent = timeStr;

      setStatus(isStale(ts) ? 'stale' : 'active', isStale(ts) ? 'Signal Stale' : 'Live Signal');

      const latlng = L.latLng(lat, lng);
      if (!marker) {
        marker = L.marker(latlng, { icon: CAR_ICON }).addTo(map);
      } else {
        marker.setLatLng(latlng);
      }

      if (firstLoad) {
        map.setView(latlng, 16);
        firstLoad = false;
        document.getElementById('loadingOverlay').classList.add('hide');
      } else {
        if (!isStale(ts)) map.panTo(latlng);
      }

    } catch (err) {
      console.error('Fetch error:', err);
      document.getElementById('errorMsg').style.display = 'block';
      setStatus('offline', 'Connection Error');
    }
  }

  fetchData();
  setInterval(fetchData, REFRESH_MS);
</script>
</body>
</html>
